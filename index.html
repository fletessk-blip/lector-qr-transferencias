<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Escanear QR</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f4;
    }

    .contenedor {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .tarjeta {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #mensaje {
      margin: 15px 0;
      font-size: 15px;
      color: #333;
    }

    button {
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
    }

    .rojo {
      background: #d93025;
      color: white;
    }

    .azul {
      background: #1a73e8;
      color: white;
    }

    button:disabled {
      background: #999;
      cursor: wait;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <div class="tarjeta">

    <h1>📷 ESCANEAR QR</h1>

    <div id="reader"></div>

    <div id="mensaje">
      Iniciando cámara...
    </div>

    <button
      id="botonEscanear"
      class="azul"
      onclick="iniciar()"
      style="display:none;">
      📷 ESCANEAR OTRO QR
    </button>

    <button
      class="rojo"
      onclick="cancelar()">
      CANCELAR
    </button>

  </div>

</div>


<script>

  // ==================================================
  // URL DE TU APLICACIÓN DE APPS SCRIPT
  // ==================================================

  var URL_APLICACION =
    "https://script.google.com/macros/s/AKfycbzEXXFt3h6k--cw8Jg0523hrU8yiC2Ie_y01lLJC6R0AN83GBNVsbODL2v1bEo9tuxs/exec";


  // ==================================================
  // VARIABLES
  // ==================================================

  var lector = null;

  var procesando = false;


  // ==================================================
  // INICIAR CÁMARA
  // ==================================================

  function iniciar() {

    procesando = false;

    document.getElementById("mensaje").innerText =
      "Iniciando cámara...";

    document.getElementById("botonEscanear").style.display =
      "none";


    // Si ya existe un lector anterior,
    // intentamos detenerlo.

    if (lector) {

      lector.stop()
        .catch(function() {})
        .finally(function() {

          crearLector();

        });

    }

    else {

      crearLector();

    }

  }


  // ==================================================
  // CREAR LECTOR
  // ==================================================

  function crearLector() {

    lector = new Html5Qrcode("reader");


    var configuracion = {

      fps: 10,

      qrbox: function(width, height) {

        var tamaño =
          Math.min(width * 0.75, height * 0.75);

        return {
          width: tamaño,
          height: tamaño
        };

      }

    };


    lector.start(

      {
        facingMode: "environment"
      },

      configuracion,


      // ==============================================
      // QR DETECTADO
      // ==============================================

      function(textoQR) {

        if (procesando) {
          return;
        }

        procesando = true;


        document.getElementById("mensaje").innerText =
          "QR detectado. Abriendo registro...";


        detenerCamara(function() {

          regresarAplicacion(textoQR);

        });

      },


      // ==============================================
      // ERROR DE LECTURA
      // ==============================================

      function(errorMessage) {

        // No mostramos estos errores.
        // Son normales mientras busca el QR.

      }

    )


    // ==============================================
    // CÁMARA INICIADA
    // ==============================================

    .then(function() {

      document.getElementById("mensaje").innerText =
        "Apunta la cámara al código QR.";

    })


    // ==============================================
    // ERROR
    // ==============================================

    .catch(function(error) {

      document.getElementById("mensaje").innerText =
        "No se pudo abrir la cámara: " + error;

      document.getElementById("botonEscanear").style.display =
        "block";

    });

  }


  // ==================================================
  // DETENER CÁMARA
  // ==================================================

  function detenerCamara(callback) {

    if (!lector) {

      callback();
      return;

    }


    lector.stop()

      .then(function() {

        callback();

      })

      .catch(function() {

        callback();

      });

  }


  // ==================================================
  // REGRESAR A APPS SCRIPT
  // ==================================================

  function regresarAplicacion(textoQR) {

    var url =
      URL_APLICACION +
      "?qr=" +
      encodeURIComponent(textoQR);

    window.location.href = url;

  }


  // ==================================================
  // CANCELAR
  // ==================================================

  function cancelar() {

    detenerCamara(function() {

      window.history.back();

    });

  }


  // ==================================================
  // INICIAR AUTOMÁTICAMENTE
  // ==================================================

window.addEventListener("load", function() {
  setTimeout(function() {
    iniciar();
  }, 500);
});

</script>

</body>

</html>
